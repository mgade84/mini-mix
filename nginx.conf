server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;
  gzip_min_length 1024;

  location ~ \.webmanifest$ {
    types { }
    default_type application/manifest+json;
  }

  # Vite fingerprints everything in /assets, so it can be cached forever.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Always revalidate the entry points so updates show up right away.
  location = /index.html { add_header Cache-Control "no-cache"; }
  location = /sw.js      { add_header Cache-Control "no-cache"; }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
