# Development:  docker compose --profile dev up
#   -> http://localhost:5173 (hot reload; also reachable from an iPad on the same Wi-Fi)
# Production:   docker compose --profile prod up -d --build
#   -> http://localhost:8080

name: mini-mix

services:
  dev:
    profiles: [dev]
    build:
      context: .
      target: dev
    ports:
      - "5173:5173"
    volumes:
      - ./:/app
      - /app/node_modules # keep the container's node_modules, not the host's
    environment:
      # Set WATCH_POLLING=true if edits don't trigger reloads (some Windows/macOS setups)
      - WATCH_POLLING=${WATCH_POLLING:-false}

  web:
    profiles: [prod]
    build:
      context: .
      target: prod
    ports:
      - "${PORT:-8080}:80"
    restart: unless-stopped
